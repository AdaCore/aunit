stages:
  - build
  - test
  - check

variables:
  GNATFORMAT_DATE: 20260510

include:
  # Issue check
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/check-issue@~latest
    inputs:
      stage: check

  # gnatformat check
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/gnatformat@main
    inputs:
      stage: check
      anod-spec: aunit
      gnatformat-args: -P lib/gnat/aunit.gpr --check
      install-gnatformat: true
      install-gnatformat-extra-anod-args: -Qdate=$GNATFORMAT_DATE

  # Build
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      job-name: build
      anod-args: build aunit -Qcoverage
      cpus: 16
      image: pe-base
      save-component: true

  # Cross build
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/build@~latest
    inputs:
      job-name: build-cross
      anod-args: build aunit --target aarch64-elf -Qcoverage
      cpus: 16
      image: pe-base
      save-component: true

  # Testing
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/test@~latest
    inputs:
      needs: ["build:linux"]
      job-name: aunit
      anod-args: test aunit -Qcoverage --minimal
      image: pe-base
      cpus: 16
      disk: 80

  # Cross testing
  - component: $CI_SERVER_FQDN/eng/gitlab-templates/test@~latest
    inputs:
      needs: ["build-cross:linux"]
      job-name: aunit-cross
      anod-args: test aunit --minimal --target aarch64-elf,,qemu-zynqmp -Qcoverage,rts=light-zynqmp
      image: pe-base
      cpus: 16
      disk: 80
  - component: $CI_SERVER_FQDN/it/gitlab-templates/gitleaks@~latest
    inputs:
      stage: check

aunit:linux:
  after_script:
    - . /tmp/ci_env.sh
    - test_dir=$(anod info test aunit -Qcoverage --show working_dir)
    - mkdir -p coverage
    - cp "$test_dir/test/coverage/cobertura.xml" coverage/
  artifacts:
    paths:
      - xunit-*.xml
      - coverage/cobertura.xml

    reports:
      junit: xunit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml

aunit-cross:linux:
  after_script:
    - . /tmp/ci_env.sh
    - test_dir=$(anod info test aunit --target aarch64-elf,,qemu-zynqmp -Qcoverage,rts=light-zynqmp --show working_dir)
    - mkdir -p coverage
    - cp "$test_dir/test/coverage/cobertura.xml" coverage/
  artifacts:
    paths:
      - xunit-*.xml
      - coverage/cobertura.xml

    reports:
      junit: xunit-*.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura.xml
